name: Windows
on:
  push:
    paths: ["windows/**", ".github/workflows/windows.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: 单元测试
        shell: cmd
        run: |
          clang -std=c11 -O1 -Wall -Wextra -Wno-unused-function -D_CRT_SECURE_NO_WARNINGS -DWXAR_TEST windows\runtime\test_tip.c -o test_tip.exe
          chcp 65001
          test_tip.exe
      - name: 安装脚本测试（Windows PowerShell 5.1）
        shell: cmd
        run: powershell -NoProfile -ExecutionPolicy Bypass -File windows\tools\test_install.ps1
      - name: 安装脚本测试（PowerShell 7）
        shell: cmd
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File windows\tools\test_install.ps1
      - name: 一键安装命令（真实下载；测试机没有微信，走到「找不到微信」为止）
        shell: pwsh
        run: |
          [Console]::OutputEncoding = [Text.Encoding]::UTF8
          $u = 'https://raw.githubusercontent.com/${{ github.repository }}/${{ github.sha }}/windows/get.ps1'
          foreach ($sh in 'powershell', 'pwsh') {
            $o = & $sh -NoProfile -Command "[Console]::OutputEncoding = [Text.Encoding]::UTF8; irm $u | iex; 'STILL-HERE'" 2>&1 | Out-String
            Write-Host "== $sh"; Write-Host $o
            if ($o -notmatch '已下载到' -or $o -notmatch '找不到微信' -or $o -notmatch 'STILL-HERE') { exit 1 }
          }
